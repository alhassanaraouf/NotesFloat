name: Release

# Push a tag like v0.2.0 to build, test and publish a GitHub Release.
# Tags with a suffix (v0.2.0-beta.1) are marked as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          echo "macOS SDK $(xcrun --show-sdk-version)"
      - name: Build, self-test, package and sign the update
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is missing; installed copies would never be offered this update."
            exit 1
          fi
          if [ -z "$SIGNING_P12" ] || [ -z "$SIGNING_P12_PASSWORD" ]; then
            echo "::error::SIGNING_P12 / SIGNING_P12_PASSWORD secrets are missing; an ad-hoc build would reset users' permissions."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}" ./build.sh --package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "NotesFloat ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            --generate-notes $pre
