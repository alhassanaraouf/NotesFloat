name: Release

# Push a tag like v0.2.0 to build, test and publish a GitHub Release.
# Tags with a suffix (v0.2.0-beta.1) are marked as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          echo "macOS SDK $(xcrun --show-sdk-version)"
      - name: Build, self-test, package and sign the update
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is missing; installed copies would never be offered this update."
            exit 1
          fi
          if [ -z "$SIGNING_P12" ] || [ -z "$SIGNING_P12_PASSWORD" ]; then
            echo "::error::SIGNING_P12 / SIGNING_P12_PASSWORD secrets are missing; an ad-hoc build would reset users' permissions."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}" REQUIRE_CHANGELOG=1 ./build.sh --package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          { echo "## What's new"; echo; cat build/whats-new.md; echo; cat .github/release-notes.md; } > build/release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "NotesFloat ${GITHUB_REF_NAME}" \
            --notes-file build/release-notes.md \
            --generate-notes $pre

  # Bumps the cask in alhassanaraouf/homebrew-tap. Needs TAP_GITHUB_TOKEN: a fine-grained PAT with
  # Contents read/write on that repo only.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "TAP_GITHUB_TOKEN is not set"; exit 1; }
          case "$GITHUB_REF_NAME" in *-*) echo "pre-release, skipping"; exit 0 ;; esac
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -O - | awk -v f="NotesFloat-$VERSION.dmg" '$2==f{print $1}')
          [ -n "$SHA" ] || { echo "no sha256 for the dmg"; exit 1; }
          git clone "https://x-access-token:$TAP_TOKEN@github.com/alhassanaraouf/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/notesfloat.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "notesfloat $VERSION"
          git push origin HEAD:main
